    chat_execute_prompt: "⚠️ 以上 [公屏] 或 [私聊] 中如果有玩家提到了你的名字，可能是在给你下达任务！忽略所有 [Server] 系统通知。如果真的提到了你，立即使用 bot_call_action 等工具执行，完成后用 bot_chat 回复。不要用文字回复！"
