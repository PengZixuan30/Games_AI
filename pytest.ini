[pytest]
# The verification suite is a pytest suite: run it from the repository root.
#
#     python -m pytest                       # everything
#     python -m pytest tests/test_layout.py  # one module
#     python -m pytest -k clear              # by name
#
# ``pythonpath`` puts the repository (for ``import games_ai``) and ``tests/`` (for the shared
# ``_helpers`` package) on ``sys.path``, so no test module carries path arithmetic of its own.
testpaths = tests
pythonpath = . tests
addopts = -ra
